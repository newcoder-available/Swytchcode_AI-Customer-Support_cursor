    - name: type
      type: STRING
      REQUIRED: false
    - name: contacts
      type: "[]STRUCT(contact_reference)"
      REQUIRED: false
      comment: The list of contacts (users or leads) involved in this conversation. This will only contain one customer unless more were added via the group conversation feature.
  conversation_teammates:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the object - `admin.list`.
    - name: teammates
      type: "[]STRUCT(reference)"
      REQUIRED: false
      comment: The list of teammates who participated in the conversation (wrote at least one conversation part).
  conversation_first_contact_reply:
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
    - name: type
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
  sla_applied:
    - name: type
      type: STRING
      REQUIRED: false
      comment: object type
    - name: sla_name
      type: STRING
      REQUIRED: false
      comment: The name of the SLA as given by the teammate when it was created.
    - name: sla_status
      type: STRING
      REQUIRED: false
      comment: |-
        SLA statuses:
                    - `hit`: If there’s at least one hit event in the underlying sla_events table, and no “missed” or “canceled” events for the conversation.
                    - `missed`: If there are any missed sla_events for the conversation and no canceled events. If there’s even a single missed sla event, the status will always be missed. A missed status is not applied when the SLA expires, only the next time a teammate replies.
                    - `active`: An SLA has been applied to a conversation, but has not yet been fulfilled. SLA status is active only if there are no “hit, “missed”, or “canceled” events.
  conversation_statistics:
    - name: type
      type: STRING
      REQUIRED: false
    - name: time_to_assignment
      type: INT
      REQUIRED: false
      comment: Duration until last assignment before first admin reply. In seconds.
    - name: time_to_admin_reply
      type: INT
      REQUIRED: false
      comment: Duration until first admin reply. Subtracts out of business hours. In seconds.
    - name: time_to_first_close
      type: INT
      REQUIRED: false
      comment: Duration until conversation was closed first time. Subtracts out of business hours. In seconds.
    - name: time_to_last_close
      type: INT
      REQUIRED: false
      comment: Duration until conversation was closed last time. Subtracts out of business hours. In seconds.
    - name: median_time_to_reply
      type: INT
      REQUIRED: false
      comment: Median based on all admin replies after a contact reply. Subtracts out of business hours. In seconds.
    - name: first_contact_reply_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of first text conversation part from a contact.
    - name: first_assignment_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of first assignment after first_contact_reply_at.
    - name: first_admin_reply_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of first admin reply after first_contact_reply_at.
    - name: first_close_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of first close after first_contact_reply_at.
    - name: last_assignment_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of last assignment after first_contact_reply_at.
    - name: last_assignment_admin_reply_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of first admin reply since most recent assignment.
    - name: last_contact_reply_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of the last conversation part from a contact.
    - name: last_admin_reply_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of the last conversation part from an admin.
    - name: last_close_at
      type: TIMESTAMP
      REQUIRED: false
      comment: Time of the last conversation close.
    - name: last_closed_by_id
      type: STRING
      REQUIRED: false
      comment: The last admin who closed the conversation. Returns a reference to an Admin object.
    - name: count_reopens
      type: INT
      REQUIRED: false
      comment: Number of reopens after first_contact_reply_at.
    - name: count_assignments
      type: INT
      REQUIRED: false
      comment: Number of assignments after first_contact_reply_at.
    - name: count_conversation_parts
      type: INT
      REQUIRED: false
      comment: Total number of conversation parts.
    - name: assigned_team_first_response_time
      type: "[]STRUCT(conversation_response_time)"
      REQUIRED: false
      comment: An array of conversation response time objects
    - name: assigned_team_first_response_time_in_office_hours
      type: "[]STRUCT(conversation_response_time)"
      REQUIRED: false
      comment: An array of conversation response time objects within office hours
    - name: handling_time
      type: INT
      REQUIRED: false
      comment: Time from conversation assignment to conversation close in seconds.
    - name: adjusted_handling_time
      type: INT
      REQUIRED: false
      comment: Adjusted handling time for conversation in seconds. This is the active handling time excluding idle periods when teammates are not actively working on the conversation.
  conversation_response_time:
    - name: team_id
      type: INT
      REQUIRED: false
      comment: Id of the assigned team.
    - name: team_name
      type: STRING
      REQUIRED: false
      comment: Name of the assigned Team, null if team does not exist, Unassigned if no team is assigned.
    - name: response_time
      type: INT
      REQUIRED: false
      comment: First response time of assigned team in seconds.
  linked_object_list:
    - name: type
      type: STRING
      REQUIRED: false
      comment: Always list.
    - name: total_count
      type: INT
      REQUIRED: false
      comment: The total number of linked objects.
    - name: has_more
      type: BOOL
      REQUIRED: false
