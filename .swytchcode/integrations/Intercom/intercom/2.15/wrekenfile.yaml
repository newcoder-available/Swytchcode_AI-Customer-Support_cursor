VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <TOKEN>
  w_base_url: https://api.intercom.io
METHODS:
  intercom.me.list:
    SUMMARY: Identify an admin
    DESC: |

      You can view the currently authorised admin along with the embedded app object (a "workspace" in legacy terminology).

      > 🚧 Single Sign On
      >
      > If you are building a custom "Log in with Intercom" flow for your site, and you call the `/me` endpoint to identify the logged-in user, you should not accept any sign-ins from users with unverified email addresses as it poses a potential impersonation security risk.
    HTTP:
      METHOD: GET
      ENDPOINT: /me
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(admin_with_app)
        RETURNVAR: intercom_me_list
        STATUS: 200
    CANONICAL_ID: intercom.me.list
  intercom.admin.away.update:
    SUMMARY: Set an admin to away
    DESC: You can set an Admin as away for the Inbox.
    HTTP:
      METHOD: PUT
      ENDPOINT: /admins/{admin_id}/away
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.admin.away.updateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - admin_id:
          TYPE: INT
          LOCATION: path
      - body:
          TYPE: STRUCT(api.admin.away.updateRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(admin)
        RETURNVAR: intercom_admin_away_update
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Admin not found (HTTP 404)
    CANONICAL_ID: intercom.admin.away.update
  intercom.admin.activityLogs.list:
    SUMMARY: List all activity logs
    DESC: You can get a log of activities by all admins in an app.
    HTTP:
      METHOD: GET
      ENDPOINT: /admins/activity_logs
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - created_at_after:
          TYPE: STRING
          LOCATION: query
      - created_at_before:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(activity_log_list)
        RETURNVAR: intercom_admin_activityLogs_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.admin.activityLogs.list
  intercom.admin.list:
    SUMMARY: List all admins
    DESC: You can fetch a list of admins for a given workspace.
    HTTP:
      METHOD: GET
      ENDPOINT: /admins
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - display_avatar:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(admin_list)
        RETURNVAR: intercom_admin_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.admin.list
  intercom.admin.get:
    SUMMARY: Retrieve an admin
    DESC: You can retrieve the details of a single admin.
    HTTP:
      METHOD: GET
      ENDPOINT: /admins/{admin_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - admin_id:
          TYPE: INT
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(admin)
        RETURNVAR: intercom_admin_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Admin not found (HTTP 404)
    CANONICAL_ID: intercom.admin.get
  intercom.ai.contentImportSources.list:
    SUMMARY: List content import sources
    DESC: You can retrieve a list of all content import sources for a workspace.
    HTTP:
      METHOD: GET
      ENDPOINT: /ai/content_import_sources
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(content_import_sources_list)
        RETURNVAR: intercom_ai_contentImportSources_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.contentImportSources.list
  intercom.ai.contentImportSources.create:
    SUMMARY: Create a content import source
    DESC: You can create a new content import source by sending a POST request to this endpoint.
    HTTP:
      METHOD: POST
      ENDPOINT: /ai/content_import_sources
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(create_content_import_source_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(create_content_import_source_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(content_import_source)
        RETURNVAR: intercom_ai_contentImportSources_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.contentImportSources.create
  intercom.ai.contentImportSources.delete:
    SUMMARY: Delete a content import source
    DESC: You can delete a content import source by making a DELETE request this endpoint. This will also delete all external pages that were imported from this source.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /ai/content_import_sources/{source_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - source_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.contentImportSources.delete
  intercom.ai.contentImportSources.get:
    SUMMARY: Retrieve a content import source
    HTTP:
      METHOD: GET
      ENDPOINT: /ai/content_import_sources/{source_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - source_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(content_import_source)
        RETURNVAR: intercom_ai_contentImportSources_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.contentImportSources.get
  intercom.ai.contentImportSources.update:
    SUMMARY: Update a content import source
    DESC: You can update an existing content import source.
    HTTP:
      METHOD: PUT
      ENDPOINT: /ai/content_import_sources/{source_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(update_content_import_source_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - source_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(update_content_import_source_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(content_import_source)
        RETURNVAR: intercom_ai_contentImportSources_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.contentImportSources.update
  intercom.ai.externalPages.list:
    SUMMARY: List external pages
    DESC: You can retrieve a list of all external pages for a workspace.
    HTTP:
      METHOD: GET
      ENDPOINT: /ai/external_pages
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(external_pages_list)
        RETURNVAR: intercom_ai_externalPages_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.externalPages.list
  intercom.ai.externalPages.create:
    SUMMARY: Create an external page (or update an external page by external ID)
    DESC: You can create a new external page by sending a POST request to this endpoint. If an external page already exists with the specified source_id and external_id, it will be updated instead.
    HTTP:
      METHOD: POST
      ENDPOINT: /ai/external_pages
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(create_external_page_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(create_external_page_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(external_page)
        RETURNVAR: intercom_ai_externalPages_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.externalPages.create
  intercom.ai.externalPages.delete:
    SUMMARY: Delete an external page
    DESC: Sending a DELETE request for an external page will remove it from the content library UI and from being used for AI answers.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /ai/external_pages/{page_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(external_page)
        RETURNVAR: intercom_ai_externalPages_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.externalPages.delete
  intercom.ai.externalPages.get:
    SUMMARY: Retrieve an external page
    DESC: You can retrieve an external page.
    HTTP:
      METHOD: GET
      ENDPOINT: /ai/external_pages/{page_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(external_page)
        RETURNVAR: intercom_ai_externalPages_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.externalPages.get
  intercom.ai.externalPages.update:
    SUMMARY: Update an external page
    DESC: You can update an existing external page (if it was created via the API).
    HTTP:
      METHOD: PUT
      ENDPOINT: /ai/external_pages/{page_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(update_external_page_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(update_external_page_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(external_page)
        RETURNVAR: intercom_ai_externalPages_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.ai.externalPages.update
  intercom.article.list:
    SUMMARY: List all articles
    DESC: |
      You can fetch a list of all articles by making a GET request to `https://api.intercom.io/articles`.

      > 📘 How are the articles sorted and ordered?
      >
      > Articles will be returned in descending order on the `updated_at` attribute. This means if you need to iterate through results then we'll show the most recently updated articles first.
    HTTP:
      METHOD: GET
      ENDPOINT: /articles
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(article_list)
        RETURNVAR: intercom_article_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.article.list
  intercom.article.create:
    SUMMARY: Create an article
    DESC: |
      You can create a new article by making a POST request to `https://api.intercom.io/articles`.

      > 📘 Tags cannot be managed via the Articles API
      >
      > Article tags are read-only in responses. To create, update, or delete tags, use the Intercom UI or the Tags API endpoints.
    HTTP:
      METHOD: POST
      ENDPOINT: /articles
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(create_article_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(create_article_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(article)
        RETURNVAR: intercom_article_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.article.create
  intercom.article.get:
    SUMMARY: Retrieve an article
    DESC: You can fetch the details of a single article by making a GET request to `https://api.intercom.io/articles/<id>`.
    HTTP:
      METHOD: GET
      ENDPOINT: /articles/{article_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - article_id:
          TYPE: INT
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(article)
        RETURNVAR: intercom_article_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Article not found (HTTP 404)
    CANONICAL_ID: intercom.article.get
  intercom.article.update:
    SUMMARY: Update an article
    DESC: |
      You can update the details of a single article by making a PUT request to `https://api.intercom.io/articles/<id>`.

      > 📘 Tags cannot be managed via the Articles API
      >
      > Article tags are read-only in responses. To create, update, or delete tags, use the Intercom UI or the Tags API endpoints.
    HTTP:
      METHOD: PUT
      ENDPOINT: /articles/{article_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(update_article_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - article_id:
          TYPE: INT
          LOCATION: path
      - body:
          TYPE: STRUCT(update_article_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(article)
        RETURNVAR: intercom_article_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Article Not Found (HTTP 404)
    CANONICAL_ID: intercom.article.update
  intercom.article.delete:
    SUMMARY: Delete an article
    DESC: You can delete a single article by making a DELETE request to `https://api.intercom.io/articles/<id>`.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /articles/{article_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - article_id:
          TYPE: INT
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(deleted_article_object)
        RETURNVAR: intercom_article_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Article Not Found (HTTP 404)
    CANONICAL_ID: intercom.article.delete
  intercom.article.search.list:
    SUMMARY: Search for articles
    DESC: You can search for articles by making a GET request to `https://api.intercom.io/articles/search`.
    HTTP:
      METHOD: GET
      ENDPOINT: /articles/search
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - phrase:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - state:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - help_center_id:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - highlight:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(article_search_response)
        RETURNVAR: intercom_article_search_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.article.search.list
  intercom.away_status_reason.list:
    SUMMARY: List all away status reasons
    DESC: Returns a list of all away status reasons configured for the workspace, including deleted ones.
    HTTP:
      METHOD: GET
      ENDPOINT: /away_status_reasons
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(away_status_reason_list)
        RETURNVAR: intercom_away_status_reason_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.away_status_reason.list
  intercom.export.enqueue.create:
    SUMMARY: Enqueue a new reporting data export job
    HTTP:
      METHOD: POST
      ENDPOINT: /export/reporting_data/enqueue
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.export.enqueue.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(api.export.enqueue.createRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.export.enqueue.createResponse200)
        RETURNVAR: intercom_export_enqueue_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Bad request (e.g. validation errors) (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 429
        WHEN: Too many jobs in progress (HTTP 429)
    CANONICAL_ID: intercom.export.enqueue.create
  intercom.export.reportingData.get:
    SUMMARY: Get export job status
    HTTP:
      METHOD: GET
      ENDPOINT: /export/reporting_data/{job_identifier}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - app_id:
          TYPE: STRING
          LOCATION: query
      - client_id:
          TYPE: STRING
          LOCATION: query
      - job_identifier:
          TYPE: STRING
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.export.reportingData.getResponse200)
        RETURNVAR: intercom_export_reportingData_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: When job not found (HTTP 404)
    CANONICAL_ID: intercom.export.reportingData.get
  intercom.export.getDatasets.list:
    SUMMARY: List available datasets and attributes
    HTTP:
      METHOD: GET
      ENDPOINT: /export/reporting_data/get_datasets
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(api.export.getDatasets.listResponse200)
        RETURNVAR: intercom_export_getDatasets_list
        STATUS: 200
    CANONICAL_ID: intercom.export.getDatasets.list
  intercom.download.reportingData.get:
    SUMMARY: Download completed export job data
    DESC: |
      Download the data from a completed reporting data export job.

      > Octet header required
      >
