  intercom.contact.subscriptions.get:
    SUMMARY: List subscriptions for a contact
    DESC: |
      You can fetch a list of subscription types that are attached to a contact. These can be subscriptions that a user has 'opted-in' to or has 'opted-out' from, depending on the subscription type.
      This will return a list of Subscription Type objects that the contact is associated with.

      The data property will show a combined list of:

        1.Opt-out subscription types that the user has opted-out from.
        2.Opt-in subscription types that the user has opted-in to receiving.

      **Note:** This endpoint only returns subscriptions where the contact has explicitly configured their preference. Subscriptions that are in the default state — where the contact has not made an explicit opt-in or opt-out choice — are not included in the response.
    HTTP:
      METHOD: GET
      ENDPOINT: /contacts/{contact_id}/subscriptions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - contact_id:
          TYPE: STRING
          LOCATION: path
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(subscription_type_list)
        RETURNVAR: intercom_contact_subscriptions_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Contact not found (HTTP 404)
    CANONICAL_ID: intercom.contact.subscriptions.get
  intercom.contact.subscriptions.create:
    SUMMARY: Add subscription to a contact
    DESC: |
      You can add a specific subscription to a contact. In Intercom, we have two different subscription types based on user consent - opt-out and opt-in:

        1.Attaching a contact to an opt-out subscription type will opt that user out from receiving messages related to that subscription type.

        2.Attaching a contact to an opt-in subscription type will opt that user in to receiving messages related to that subscription type.

      This will return a subscription type model for the subscription type that was added to the contact.
    HTTP:
      METHOD: POST
      ENDPOINT: /contacts/{contact_id}/subscriptions
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.contact.subscriptions.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - contact_id:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(api.contact.subscriptions.createRequest)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(subscription_type)
        RETURNVAR: intercom_contact_subscriptions_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Resource not found (HTTP 404)
    CANONICAL_ID: intercom.contact.subscriptions.create
