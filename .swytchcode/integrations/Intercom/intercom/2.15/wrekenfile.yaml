      REQUIRED: true
      comment: An array of one or more error objects
  external_page:
    - name: type
      type: STRING
      REQUIRED: true
      comment: Always external_page
    - name: id
      type: STRING
      REQUIRED: true
      comment: The unique identifier for the external page which is given by Intercom.
    - name: title
      type: STRING
      REQUIRED: true
      comment: The title of the external page.
    - name: html
      type: STRING
      REQUIRED: true
      comment: The body of the external page in HTML.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of the external page. This will be used by Fin to link end users to the page it based its answer on.
    - name: ai_agent_availability
      type: BOOL
      REQUIRED: true
      comment: Whether the external page should be used to answer questions by AI Agent.
    - name: ai_copilot_availability
      type: BOOL
      REQUIRED: true
      comment: Whether the external page should be used to answer questions by AI Copilot.
    - name: ai_sales_agent_availability
      type: BOOL
      REQUIRED: false
      comment: Whether the external page should be used to answer questions by AI Sales Agent.
    - name: fin_availability
      type: BOOL
      REQUIRED: false
      comment: Deprecated. Use ai_agent_availability and ai_copilot_availability instead.
    - name: locale
      type: STRING
      REQUIRED: true
      comment: Always en
    - name: source_id
      type: INT
      REQUIRED: true
      comment: The unique identifier for the source of the external page which was given by Intercom. Every external page must be associated with a Content Import Source which represents the place it comes from and from which it inherits a default audience (configured in the UI). For a new source, make a POST request to the Content Import Source endpoint and an ID for the source will be returned in the response.
    - name: external_id
      type: STRING
      REQUIRED: true
      comment: The identifier for the external page which was given by the source. Must be unique for the source.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The time when the external page was created.
    - name: updated_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The time when the external page was last updated.
    - name: last_ingested_at
      type: TIMESTAMP
      REQUIRED: true
      comment: The time when the external page was last ingested.
  external_pages_list:
