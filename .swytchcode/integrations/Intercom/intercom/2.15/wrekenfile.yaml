  create_article_request:
    - name: title
      type: STRING
      REQUIRED: true
      comment: The title of the article.For multilingual articles, this will be the title of the default language's content.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The description of the article. For multilingual articles, this will be the description of the default language's content.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The content of the article. For multilingual articles, this will be the body of the default language's content.
    - name: author_id
      type: INT
      REQUIRED: true
      comment: The id of the author of the article. For multilingual articles, this will be the id of the author of the default language's content. Must be a teammate on the help center's workspace.
    - name: state
      type: STRING
      REQUIRED: false
      comment: Whether the article will be `published` or will be a `draft`. Defaults to draft. For multilingual articles, this will be the state of the default language's content.
    - name: parent_id
      type: INT
      REQUIRED: false
      comment: The id of the article's parent collection or section. An article without this field stands alone.
    - name: parent_type
      type: STRING
      REQUIRED: false
      comment: The type of parent, which can either be a `collection` or `section`.
    - name: translated_content
      type: STRUCT(article_translated_content)
      REQUIRED: false
  create_internal_article_request:
    - name: title
      type: STRING
      REQUIRED: true
      comment: The title of the article.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The content of the article.
    - name: author_id
      type: INT
      REQUIRED: true
      comment: The id of the author of the article.
    - name: owner_id
      type: INT
      REQUIRED: true
      comment: The id of the owner of the article.
  create_collection_request:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the collection. For multilingual collections, this will be the name of the default language's content.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The description of the collection. For multilingual collections, this will be the description of the default language's content.
    - name: translated_content
      type: STRUCT(group_translated_content)
      REQUIRED: false
    - name: parent_id
