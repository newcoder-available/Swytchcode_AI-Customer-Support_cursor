    DESC: You can fetch a single company.
    HTTP:
      METHOD: GET
      ENDPOINT: /companies/{company_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
