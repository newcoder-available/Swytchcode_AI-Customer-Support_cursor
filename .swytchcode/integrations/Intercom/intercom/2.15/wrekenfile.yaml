      REQUIRED: false
      comment: The type of attachment
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the attachment
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of the attachment
    - name: content_type
