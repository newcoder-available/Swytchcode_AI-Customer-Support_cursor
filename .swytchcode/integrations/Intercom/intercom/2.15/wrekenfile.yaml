    - name: description
      type: STRING
      REQUIRED: false
      comment: Readable description of the attribute.
    - name: data_type
      type: STRING
      REQUIRED: false
      comment: The data type of the attribute.
    - name: options
      type: "[]STRING"
      REQUIRED: false
      comment: List of predefined options for attribute value.
    - name: api_writable
      type: BOOL
      REQUIRED: false
      comment: Can this attribute be updated through API
    - name: messenger_writable
      type: BOOL
      REQUIRED: false
      comment: Can this attribute be updated by the Messenger
    - name: ui_writable
      type: BOOL
      REQUIRED: false
      comment: Can this attribute be updated in the UI
    - name: custom
      type: BOOL
      REQUIRED: false
      comment: Set to true if this is a CDA
    - name: archived
