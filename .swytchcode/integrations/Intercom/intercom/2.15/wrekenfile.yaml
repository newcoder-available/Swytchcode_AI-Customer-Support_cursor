    CANONICAL_ID: intercom.visitor.list
  intercom.visitor.convert.create:
    SUMMARY: Convert a visitor
    DESC: |
      You can merge a Visitor to a Contact of role type `lead` or `user`.

      > 📘 What happens upon a visitor being converted?
      >
      > If the User exists, then the Visitor will be merged into it, the Visitor deleted and the User returned. If the User does not exist, the Visitor will be converted to a User, with the User identifiers replacing it's Visitor identifiers.
    HTTP:
      METHOD: POST
      ENDPOINT: /visitors/convert
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(convert_visitor_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(convert_visitor_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(contact)
        RETURNVAR: intercom_visitor_convert_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.visitor.convert.create
