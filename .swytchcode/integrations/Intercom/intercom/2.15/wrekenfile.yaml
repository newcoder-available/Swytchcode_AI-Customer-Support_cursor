  intercom.company.create:
    SUMMARY: Create or Update a company
    DESC: |
      You can create or update a company.

      Companies will be only visible in Intercom when there is at least one associated user.

      Companies are looked up via `company_id` in a `POST` request, if not found via `company_id`, the new company will be created, if found, that company will be updated.

      {% admonition type="warning" name="Using `company_id`" %}
        You can set a unique `company_id` value when creating a company. However, it is not possible to update `company_id`. Be sure to set a unique value once upon creation of the company.
      {% /admonition %}
    HTTP:
      METHOD: POST
      ENDPOINT: /companies
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(create_or_update_company_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(create_or_update_company_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(company)
        RETURNVAR: intercom_company_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
    CANONICAL_ID: intercom.company.create
  intercom.company.list:
    SUMMARY: Retrieve companies
    DESC: |
      You can fetch a single company by passing in `company_id` or `name`.

        `https://api.intercom.io/companies?name={name}`

        `https://api.intercom.io/companies?company_id={company_id}`

      You can fetch all companies and filter by `segment_id` or `tag_id` as a query parameter.

        `https://api.intercom.io/companies?tag_id={tag_id}`

        `https://api.intercom.io/companies?segment_id={segment_id}`
    HTTP:
      METHOD: GET
      ENDPOINT: /companies
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - name:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - company_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - tag_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - segment_id:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - per_page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(company_list)
        RETURNVAR: intercom_company_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Company Not Found (HTTP 404)
    CANONICAL_ID: intercom.company.list
  intercom.company.get:
