    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Accept:
          TYPE: STRING
          LOCATION: header
      - app_id:
          TYPE: STRING
          LOCATION: query
      - job_identifier:
          TYPE: STRING
          LOCATION: query
    ERRORS:
