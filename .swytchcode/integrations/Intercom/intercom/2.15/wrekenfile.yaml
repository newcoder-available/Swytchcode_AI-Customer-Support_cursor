    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the file. Required when type is 'file'.
    - name: content_type
      type: STRING
      REQUIRED: false
      comment: The MIME type of the file. Required when type is 'file'.
    - name: data
      type: STRING
      REQUIRED: false
      comment: Base64-encoded file data. Required when type is 'file'.
  fin_agent_conversation_metadata:
