    - name: title
      type: STRING
      REQUIRED: false
      comment: The title given to the conversation.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the conversation was created.
    - name: updated_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time the conversation was updated.
    - name: waiting_since
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time a Contact responded to an Admin. In other words, the time a customer started waiting for a response. Set to null if last reply is from an Admin.
    - name: snoozed_until
      type: TIMESTAMP
      REQUIRED: false
      comment: If set this is the time in the future when this conversation will be marked as open. i.e. it will be in a snoozed state until this time. i.e. it will be in a snoozed state until this time.
    - name: open
      type: BOOL
      REQUIRED: false
      comment: Indicates whether a conversation is open (true) or closed (false).
    - name: state
      type: STRING
      REQUIRED: false
      comment: Can be set to "open", "closed" or "snoozed".
    - name: read
      type: BOOL
      REQUIRED: false
      comment: Indicates whether a conversation has been read.
    - name: priority
      type: STRING
      REQUIRED: false
      comment: If marked as priority, it will return priority or else not_priority.
    - name: admin_assignee_id
      type: INT
      REQUIRED: false
      comment: The id of the admin assigned to the conversation. If it's not assigned to an admin it will return null.
    - name: team_assignee_id
      type: INT
      REQUIRED: false
      comment: The id of the team assigned to the conversation. If it's not assigned to a team it will return null.
    - name: company
      type: STRUCT(company)
      REQUIRED: false
      comment: The company associated with the conversation.
    - name: tags
      type: STRUCT(tags)
      REQUIRED: false
    - name: conversation_rating
      type: STRUCT(conversation_rating)
      REQUIRED: false
    - name: source
      type: STRUCT(conversation_source)
      REQUIRED: false
    - name: contacts
      type: STRUCT(conversation_contacts)
      REQUIRED: false
    - name: teammates
      type: STRUCT(conversation_teammates)
      REQUIRED: false
    - name: custom_attributes
      type: map[STRING]ANY
      REQUIRED: false
    - name: first_contact_reply
      type: STRUCT(conversation_first_contact_reply)
      REQUIRED: false
    - name: sla_applied
      type: STRUCT(sla_applied)
      REQUIRED: false
    - name: statistics
      type: STRUCT(conversation_statistics)
      REQUIRED: false
    - name: linked_objects
      type: STRUCT(linked_object_list)
      REQUIRED: false
    - name: ai_agent_participated
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the AI Agent participated in the conversation.
    - name: ai_agent
      type: STRUCT(ai_agent)
      REQUIRED: false
  conversation_rating:
    - name: rating
      type: INT
      REQUIRED: false
      comment: The rating, between 1 and 5, for the conversation.
    - name: remark
      type: STRING
      REQUIRED: false
      comment: An optional field to add a remark to correspond to the number rating
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the rating was requested in the conversation being rated.
    - name: updated_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the rating was last updated.
    - name: contact
      type: STRUCT(contact_reference)
      REQUIRED: false
    - name: teammate
      type: STRUCT(reference)
      REQUIRED: false
  conversation_source:
    - name: type
      type: STRING
      REQUIRED: false
      comment: This includes conversation, email, facebook, instagram, phone_call, phone_switch, push, sms, twitter and whatsapp.
    - name: id
      type: STRING
      REQUIRED: false
      comment: The id representing the message.
    - name: delivered_as
      type: STRING
      REQUIRED: false
      comment: The conversation's initiation type. Possible values are customer_initiated, campaigns_initiated (legacy campaigns), operator_initiated (Custom bot), automated (Series and other outbounds with dynamic audience message) and admin_initiated (fixed audience message, ticket initiated by an admin, group email).
    - name: subject
      type: STRING
      REQUIRED: false
      comment: Optional. The message subject. For Twitter, this will show a generic message regarding why the subject is obscured. In webhook payloads for API version 2.15+, this field returns plain text.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The message body, which may contain HTML. For Twitter, this will show a generic message regarding why the body is obscured. In webhook payloads for API version 2.15+, this field returns plain text.
    - name: author
      type: STRUCT(conversation_part_author)
      REQUIRED: false
    - name: attachments
      type: "[]STRUCT(part_attachment)"
      REQUIRED: false
      comment: A list of attachments for the part.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL where the conversation was started. For Twitter, Email, and Bots, this will be blank.
    - name: redacted
      type: BOOL
      REQUIRED: false
      comment: Whether or not the source message has been redacted. Only applicable for contact initiated messages.
  conversation_part_author:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the author
    - name: id
      type: STRING
      REQUIRED: false
      comment: The id of the author
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the author
    - name: email
      type: STRING
      REQUIRED: false
      comment: The email of the author
    - name: from_ai_agent
      type: BOOL
      REQUIRED: false
      comment: If this conversation part was sent by the AI Agent
    - name: is_ai_answer
      type: BOOL
      REQUIRED: false
      comment: If this conversation part body was generated by the AI Agent
  part_attachment:
    - name: type
