    - name: tags
      type: STRUCT(tags)
      REQUIRED: false
    - name: conversation_rating
      type: STRUCT(conversation_rating)
      REQUIRED: false
    - name: source
      type: STRUCT(conversation_source)
      REQUIRED: false
    - name: contacts
      type: STRUCT(conversation_contacts)
      REQUIRED: false
    - name: teammates
      type: STRUCT(conversation_teammates)
      REQUIRED: false
    - name: custom_attributes
      type: map[STRING]ANY
      REQUIRED: false
    - name: first_contact_reply
      type: STRUCT(conversation_first_contact_reply)
      REQUIRED: false
    - name: sla_applied
      type: STRUCT(sla_applied)
      REQUIRED: false
    - name: statistics
      type: STRUCT(conversation_statistics)
      REQUIRED: false
    - name: conversation_parts
      type: STRUCT(conversation_parts)
      REQUIRED: false
    - name: linked_objects
      type: STRUCT(linked_object_list)
      REQUIRED: false
    - name: ai_agent_participated
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the AI Agent participated in the conversation.
    - name: ai_agent
      type: STRUCT(ai_agent)
      REQUIRED: false
  conversation_parts:
    - name: type
      type: STRING
      REQUIRED: false
    - name: conversation_parts
      type: "[]STRUCT(conversation_part)"
      REQUIRED: false
      comment: A list of Conversation Part objects for each part message in the conversation. This is only returned when Retrieving a Conversation, and ignored when Listing all Conversations. There is a limit of 500 parts.
    - name: total_count
      type: INT
      REQUIRED: false
  conversation_part:
    - name: type
      type: STRING
      REQUIRED: false
      comment: Always conversation_part
    - name: id
      type: STRING
      REQUIRED: false
      comment: The id representing the conversation part.
    - name: part_type
      type: STRING
      REQUIRED: false
      comment: The type of conversation part.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The message body, which may contain HTML. For Twitter, this will show a generic message regarding why the body is obscured. In webhook payloads for API version 2.15+, this field returns plain text.
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the conversation part was created.
    - name: updated_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The last time the conversation part was updated.
    - name: notified_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the user was notified with the conversation part.
    - name: assigned_to
      type: STRUCT(reference)
      REQUIRED: false
      comment: The id of the admin that was assigned the conversation by this conversation_part (null if there has been no change in assignment.)
    - name: author
      type: STRUCT(conversation_part_author)
      REQUIRED: false
    - name: attachments
      type: "[]STRUCT(part_attachment)"
      REQUIRED: false
      comment: A list of attachments for the part.
    - name: external_id
      type: STRING
      REQUIRED: false
      comment: The external id of the conversation part
    - name: redacted
      type: BOOL
      REQUIRED: false
      comment: Whether or not the conversation part has been redacted.
    - name: email_message_metadata
      type: STRUCT(email_message_metadata)
      REQUIRED: false
    - name: metadata
      type: STRUCT(conversation_part_metadata)
      REQUIRED: false
    - name: state
      type: STRING
      REQUIRED: false
      comment: Indicates the current state of conversation when the conversation part was created.
    - name: tags
      type: "[]STRUCT(tag_basic)"
      REQUIRED: false
      comment: A list of tags objects associated with the conversation part.
    - name: event_details
      type: OBJECT
      REQUIRED: false
    - name: app_package_code
      type: STRING
      REQUIRED: false
      comment: The app package code if this part was created via API. null if the part was not created via API.
  email_message_metadata:
    - name: subject
      type: STRING
      REQUIRED: false
      comment: The subject of the email
    - name: email_address_headers
      type: "[]STRUCT(email_address_header)"
      REQUIRED: false
      comment: A list of an email address headers.
    - name: message_id
      type: STRING
      REQUIRED: false
      comment: The unique identifier for the email message as specified in the Message-ID header
  email_address_header:
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of email address header
    - name: email_address
      type: STRING
      REQUIRED: false
      comment: The email address
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name associated with the email address
  conversation_part_metadata:
    - name: quick_reply_options
      type: "[]ANY"
      REQUIRED: false
      comment: The quick reply options sent by the Admin or bot, presented in this conversation part.
    - name: quick_reply_uuid
      type: STRING
      REQUIRED: false
      comment: The unique identifier for the quick reply option that was clicked by the end user.
  conversation_deleted:
