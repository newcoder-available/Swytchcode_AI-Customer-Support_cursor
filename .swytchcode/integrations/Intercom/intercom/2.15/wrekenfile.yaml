          REQUIRED: false
          LOCATION: header
      - job_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(jobs)
        RETURNVAR: intercom_job_status_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Job not found (HTTP 404)
    CANONICAL_ID: intercom.job.status.get
  intercom.message.create:
    SUMMARY: Create a message
    DESC: |
      You can create a message that has been initiated by an admin. The conversation can be either an in-app message or an email.

      > 🚧 Sending for visitors
      >
      > There can be a short delay between when a contact is created and when a contact becomes available to be messaged through the API. A 404 Not Found error will be returned in this case.

      This will return the Message model that has been created.

      > 🚧 Retrieving Associated Conversations
      >
      > As this is a message, there will be no conversation present until the contact responds. Once they do, you will have to search for a contact's conversations with the id of the message.
    HTTP:
      METHOD: POST
      ENDPOINT: /messages
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(create_message_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(create_message_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(message)
        RETURNVAR: intercom_message_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: No body supplied for email message (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: API plan restricted (HTTP 403)
      - TYPE: STRUCT(error)
        STATUS: 422
        WHEN: No subject supplied for email message (HTTP 422)
    CANONICAL_ID: intercom.message.create
