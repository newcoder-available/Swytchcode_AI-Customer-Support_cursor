      type: STRING
      REQUIRED: false
      comment: The unique identifier for the conversation.
    - name: object
      type: STRING
      REQUIRED: false
      comment: always conversation
    - name: deleted
      type: BOOL
      REQUIRED: false
      comment: Whether the conversation is deleted or not.
  conversation_list:
    - name: type
      type: STRING
      REQUIRED: false
      comment: Always conversation.list
    - name: conversations
      type: "[]STRUCT(conversation_list_item)"
      REQUIRED: false
      comment: The list of conversation objects
    - name: total_count
