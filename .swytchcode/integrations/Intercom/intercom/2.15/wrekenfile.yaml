  intercom.fin_voice.register.create:
    SUMMARY: Register a Fin Voice call
    DESC: |
      Register a Fin Voice call with Intercom. This endpoint creates an external reference
      that links an external call identifier to an Intercom call and conversation.

      The call can be from different sources:
      - AWS Connect (default)
      - Five9
      - Zoom Phone
    HTTP:
      METHOD: POST
      ENDPOINT: /fin_voice/register
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(register_fin_voice_call_request)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(register_fin_voice_call_request)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ai_call_response)
        RETURNVAR: intercom_fin_voice_register_create
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: intercom_fin_voice_register_create_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 400
        WHEN: bad request - missing phone_number or call_id (HTTP 400)
      - TYPE: STRUCT(error)
        STATUS: 409
        WHEN: conflict - duplicate call registration (HTTP 409)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Unexpected error (HTTP default)
    CANONICAL_ID: intercom.fin_voice.register.create
  intercom.fin_voice.collect.get:
    SUMMARY: Collect Fin Voice call by ID
    DESC: Retrieve information about a Fin Voice call using the external reference ID.
    HTTP:
      METHOD: GET
      ENDPOINT: /fin_voice/collect/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - id:
          TYPE: INT
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ai_call_response)
        RETURNVAR: intercom_fin_voice_collect_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: intercom_fin_voice_collect_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: not found - external reference not found or not matched (HTTP 404)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Unexpected error (HTTP default)
    CANONICAL_ID: intercom.fin_voice.collect.get
  intercom.fin_voice.externalId.get:
    SUMMARY: Collect Fin Voice call by external ID
    DESC: Retrieve information about a Fin Voice call using the external call identifier.
    HTTP:
      METHOD: GET
      ENDPOINT: /fin_voice/external_id/{external_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - external_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ai_call_response)
        RETURNVAR: intercom_fin_voice_externalId_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: intercom_fin_voice_externalId_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: not found - external reference not found or not matched (HTTP 404)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Unexpected error (HTTP default)
    CANONICAL_ID: intercom.fin_voice.externalId.get
  intercom.fin_voice.phoneNumber.get:
    SUMMARY: Collect Fin Voice call by phone number
    DESC: |
      Retrieve information about a Fin Voice call using the phone number.

      Returns the most recent matched call for the given phone number, ordered by creation date.
    HTTP:
      METHOD: GET
      ENDPOINT: /fin_voice/phone_number/{phone_number}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - phone_number:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: intercom_fin_voice_phoneNumber_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: not found - no call found for phone number or not matched (HTTP 404)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Unexpected error (HTTP default)
    CANONICAL_ID: intercom.fin_voice.phoneNumber.get
  intercom.fin_voice.conversation.get:
    SUMMARY: Collect Fin Voice calls by conversation ID
    DESC: |
      Retrieve information about Fin Voice calls associated with a conversation.

      Returns all matched calls for the given conversation ID. A conversation may have multiple associated calls.
    HTTP:
      METHOD: GET
      ENDPOINT: /fin_voice/conversation/{conversation_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: "[]STRUCT(ai_call_response)"
        RETURNVAR: intercom_fin_voice_conversation_get
        STATUS: 200
      - RETURNTYPE: STRUCT(error)
        RETURNVAR: intercom_fin_voice_conversation_get_NaN
        STATUS: .nan
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(error)
        STATUS: 500
        WHEN: Unexpected error (HTTP default)
    CANONICAL_ID: intercom.fin_voice.conversation.get
  intercom.export.workflows.get:
    SUMMARY: Export a workflow
    DESC: |
      Export a workflow configuration by its ID. This endpoint returns the complete workflow definition including its steps, targeting rules, and attributes.

      This endpoint is designed for EU Data Act compliance, allowing customers to export their workflow configurations.
    HTTP:
      METHOD: GET
      ENDPOINT: /export/workflows/{id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Intercom-Version:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - id:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(workflow_export)
        RETURNVAR: intercom_export_workflows_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(error)
        STATUS: 403
        WHEN: Workflow export is not available for this app (HTTP 403)
      - TYPE: STRUCT(error)
        STATUS: 404
        WHEN: Workflow not found (HTTP 404)
    CANONICAL_ID: intercom.export.workflows.get
STRUCTS:
  datetime:
    - name: variant_0
      type: TIMESTAMP
      REQUIRED: false
    - name: variant_1
      type: INT
      REQUIRED: false
  activity_log:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The id representing the activity.
    - name: performed_by
      type: OBJECT
      REQUIRED: false
      comment: Details about the Admin involved in the activity.
    - name: metadata
      type: STRUCT(activity_log_metadata)
      REQUIRED: false
    - name: created_at
      type: TIMESTAMP
      REQUIRED: false
      comment: The time the activity was created.
    - name: activity_type
      type: STRING
      REQUIRED: false
    - name: activity_description
      type: STRING
      REQUIRED: false
      comment: A sentence or two describing the activity.
  activity_log_metadata:
    - name: sign_in_method
      type: STRING
      REQUIRED: false
      comment: The way the admin signed in.
    - name: external_id
      type: STRING
      REQUIRED: false
      comment: The unique identifier for the contact which is provided by the Client.
    - name: away_mode
      type: BOOL
      REQUIRED: false
      comment: The away mode status which is set to true when away and false when returned.
    - name: away_status_reason
      type: STRING
      REQUIRED: false
      comment: The reason the Admin is away.
    - name: reassign_conversations
      type: BOOL
      REQUIRED: false
      comment: Indicates if conversations should be reassigned while an Admin is away.
    - name: source
      type: STRING
      REQUIRED: false
      comment: The action that initiated the status change.
    - name: auto_changed
      type: STRING
      REQUIRED: false
      comment: Indicates if the status was changed automatically or manually.
    - name: update_by
      type: INT
      REQUIRED: false
      comment: The ID of the Admin who initiated the activity.
    - name: update_by_name
      type: STRING
      REQUIRED: false
      comment: The name of the Admin who initiated the activity.
    - name: conversation_assignment_limit
      type: INT
      REQUIRED: false
      comment: The conversation assignment limit value for an admin.
    - name: ticket_assignment_limit
